<!DOCTYPE html><html lang="he" dir="rtl"><meta charset="utf-8"><body style="font-family:Arial">מכין תמונה...
<script>
const API='https://script.google.com/macros/s/AKfycbxNHQLq0iImMoXE9EKuejziy8lM5_gLmkTV_TgYJi2H4KyaqXpWiIgZ3vftD88ln3vWDA/exec';
(async()=>{
  const r=await (await fetch(API,{method:'POST',body:JSON.stringify({action:'hero'})})).json();
  const img=new Image(); img.src=r.url; await img.decode();
  const c=document.createElement('canvas'); c.width=1280; c.height=Math.round(img.height*1280/img.width);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  c.toBlob(b=>{ if(window.opener){ window.opener.postMessage({hero:b},'https://github.com'); document.body.textContent='נשלח ('+b.size+')'; } },'image/jpeg',0.6);
})();
</script></body></html>
